<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pet’s Pet · 明暗启动动画</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#ececec;color:#222}
header{max-width:1120px;margin:0 auto 18px;display:flex;align-items:center;gap:12px}strong{margin-right:auto;font-weight:600}
button{border:1px solid #ccc;border-radius:7px;padding:7px 14px;background:#fff;color:#222;cursor:pointer}button[aria-pressed=true]{background:#222;color:white;border-color:#222}
main{max-width:1120px;margin:auto;background:#fafafa;border-radius:12px;overflow:hidden}iframe{display:block;width:100%;aspect-ratio:16/10;border:0}
p{max-width:1120px;margin:14px auto;color:#666;font-size:12px}
</style>
<header><strong>Pet’s Pet · 启动动画预览</strong><button id="light" aria-pressed="true">浅色</button><button id="dark" aria-pressed="false">深色</button><button id="replay">重播</button></header>
<main><iframe title="启动动画" src="../Sources/PetsPet/DefaultStartup.html"></iframe></main>
<p>此页预览两套动画的构图与配色。应用内浅色透明区域使用系统毛玻璃背景，实际启动会在客户端就绪后渐隐。</p>
<script>
let theme='light';const frame=document.querySelector('iframe');
function show(next){theme=next;document.querySelector('main').style.background=theme==='light'?'#fafafa':'#05040a';for(const t of ['light','dark'])document.getElementById(t).setAttribute('aria-pressed',String(t===theme));frame.src='../Sources/PetsPet/'+(theme==='light'?'DefaultStartup':'DefaultStartupDark')+'.html'}
for(const t of ['light','dark'])document.getElementById(t).onclick=()=>show(t);document.getElementById('replay').onclick=()=>show(theme);
</script></html>
