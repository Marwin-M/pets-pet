function layout(){VW=Math.max(1,innerWidth);VH=Math.max(1,innerHeight);K=Math.min(window.devicePixelRatio||1,3200/VW);S=Math.min(VW/W,VH/H);OX=(VW-W*S)/2;OY=(VH-H*S)/2;Q=K*S;
X0=-OX/S;X1=W+OX/S;Y0=-OY/S;Y1=H+OY/S;WD=X1-X0;HD=Y1-Y0;
RL=Math.max(1500,Math.hypot(Math.max(CX-X0,X1-CX),Math.max(600-Y0,Y1-600))+100);
cv.width=Math.round(VW*K);cv.height=Math.round(VH*K);for(const c of [L,TL]){c.width=Math.round(W*Q);c.height=Math.round(H*Q)}}
layout();

function glow(x,y,r,c){if(r<=0)return;const q=g.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,c);q.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=q;g.fillRect(x-r,y-r,2*r,2*r)}
function rays(t,a){g.save();g.translate(CX,600);g.rotate(t*.09);const q=g.createLinearGradient(0,0,RL,0);q.addColorStop(0,`rgba(255,255,255,${a})`);q.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=q;for(let i=0;i<14;i++){g.rotate(Math.PI/7);g.beginPath();g.moveTo(0,0);g.lineTo(RL,-RL*.0533);g.lineTo(RL,RL*.0533);g.fill()}g.restore()}
function ring(r,w,a,dash,off){if(a<=0)return;g.save();g.globalAlpha=a;g.lineWidth=w;g.strokeStyle='#fff';g.shadowColor='rgba(130,100,255,.95)';g.shadowBlur=Q*24;g.setLineDash(dash);g.lineDashOffset=off;g.beginPath();g.arc(CX,610,r,0,Math.PI*2);g.stroke();g.restore()}
function star(x,y,r,a){g.save();g.translate(x,y);g.fillStyle=`rgba(255,255,255,${a})`;g.shadowColor='rgba(140,110,255,.9)';g.shadowBlur=Q*10;g.beginPath();for(let i=0;i<8;i++){const rr=i%2?r*.22:r,an=i*Math.PI/4;g.lineTo(Math.sin(an)*rr,-Math.cos(an)*rr)}g.closePath();g.fill();g.restore()}
function parts(t){const nP=Math.min(P.length,Math.round(130*Math.max(1,WD*HD/(W*H))));for(let pi=0;pi<nP;pi++){const p=P[pi];const a=seg(t,p.d,p.d+.6)*(.55+.45*Math.sin(t*6+p.ph));if(a<=0)continue;
const x=X0+((p.x*WD+p.dx*t+Math.sin(t*2+p.ph)*12)%WD+WD)%WD,y=Y0+((p.y*HD-p.v*t)%HD+HD)%HD;
if(p.star)star(x,y,p.r*4.6,a);else{g.save();g.fillStyle=`rgba(255,255,255,${a*.9})`;g.shadowColor='rgba(140,110,255,.8)';g.shadowBlur=Q*8;g.beginPath();g.arc(x,y,p.r,0,7);g.fill();g.restore()}}}

function title(t){
const p=seg(t,1.2,2.3);if(p<=0)return;
const sp=eio(seg(t,1.2,2.0)),fp=eo(seg(t,1.75,2.45)),ls=(46*(1-eo(p))+8)+'px';
g.save();txt(g);g.letterSpacing=ls;
g.globalAlpha=fp;const f=g.createLinearGradient(0,TY-90,0,TY+90);f.addColorStop(0,'#ffffff');f.addColorStop(1,'#cfc3ff');g.fillStyle=f;g.fillText(NAME,TX,TY);
g.globalAlpha=Math.min(1,sp*3);g.lineWidth=2.4;g.strokeStyle='#8d7bec';g.shadowColor='rgba(120,95,235,.9)';g.shadowBlur=Q*14;g.setLineDash([800,800]);g.lineDashOffset=800*(1-sp);g.strokeText(NAME,TX,TY);
g.restore();

if(sw>0&&sw<1){tg.setTransform(1,0,0,1,0,0);tg.clearRect(0,0,TL.width,TL.height);tg.setTransform(Q,0,0,Q,0,0);tg.save();txt(tg);tg.letterSpacing=ls;tg.fillStyle='#fff';tg.fillText(NAME,TX,TY);tg.globalCompositeOperation='source-in';
const bx=1000+eo(sw)*900,q=tg.createLinearGradient(bx-110,TY-110,bx+110,TY+110);q.addColorStop(0,'rgba(255,255,255,0)');q.addColorStop(.5,'rgba(255,255,255,1)');q.addColorStop(1,'rgba(255,255,255,0)');tg.fillStyle=q;tg.fillRect(0,0,W,H);tg.restore();g.drawImage(TL,0,0,W,H)}
const u=eo(seg(t,1.9,2.6));
if(u>0){const y=722,hw=330*u;g.save();g.strokeStyle='#c4b8ff';g.fillStyle='#c4b8ff';g.lineWidth=2;g.shadowColor='rgba(110,85,220,.9)';g.shadowBlur=Q*12;g.beginPath();g.moveTo(TX-hw,y);g.lineTo(TX-16,y);g.moveTo(TX+16,y);g.lineTo(TX+hw,y);g.stroke();g.beginPath();g.moveTo(TX,y-9);g.lineTo(TX+9,y);g.lineTo(TX,y+9);g.lineTo(TX-9,y);g.fill();g.restore()}}

function draw(t){
t=clamp(t,0,DUR);lastT=t;if(!IMG.complete||!IMG.naturalWidth)return;
g.globalCompositeOperation='source-over';g.globalAlpha=1;g.shadowBlur=Q*0;
g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cv.width,cv.height);g.setTransform(Q,0,0,Q,OX*K,OY*K);let q;

let t0=null,done=false,rafID=0;
function loop(ts){if(window.__manual)return;if(t0===null){t0=ts;window.dispatchEvent(new CustomEvent('splash:playing'))}const t=(ts-t0)/1000;draw(t);
if(t>=DUR){if(!done){done=true;window.dispatchEvent(new CustomEvent('splash:done'))}return}rafID=requestAnimationFrame(loop)}
window.startSplash=()=>{cancelAnimationFrame(rafID);t0=null;done=false;rafID=requestAnimationFrame(loop)};
window.ready.then(()=>{if(!new URLSearchParams(location.search).has('preview'))window.startSplash()});
addEventListener('click',()=>window.startSplash());
</script></body></html>
